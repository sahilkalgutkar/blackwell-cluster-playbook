# Copy to inventory.ini (git-ignored) and replace with your hosts.

[slurmctld]
head01 ansible_host=10.0.0.10

[slurmd]
# HGX B200 example: 8 GPUs, 2 x 56-core CPUs with SMT
gpu01 ansible_host=10.0.0.21 slurm_cpus=224 slurm_real_memory_mb=2000000
gpu02 ansible_host=10.0.0.22 slurm_cpus=224 slurm_real_memory_mb=2000000

[all:vars]
ansible_user=ubuntu
