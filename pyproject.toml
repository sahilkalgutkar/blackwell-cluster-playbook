[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "blackwell-cluster-playbook"
version = "0.1.0"
description = "Bring-up, validation and benchmarking toolkit for NVIDIA Blackwell GPU clusters, from one HGX node to an NVL72 rack."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
dependencies = ["pyyaml>=6.0"]
keywords = ["nvidia", "blackwell", "nvl72", "hgx", "dgx", "nccl", "dcgm", "hpc", "slurm", "kubernetes"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Topic :: System :: Clustering",
  "Topic :: System :: Benchmark",
]

[project.optional-dependencies]
plot = ["matplotlib>=3.8"]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
bcp = "bcp.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
